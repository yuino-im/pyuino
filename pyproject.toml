[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyuino"
description = "LLM Japanese Kana-Kanji convetor"
authors = [{name = "Masahiko Hashimoto"}]
readme = "README.md"
requires-python = ">= 3.10"
dynamic = ["version"]
dependencies = [
    "torch",
    "tqdm",
    "protobuf",
    "transformers",
    "datasets",
    "gensim>=4.4.0",
    "jaconv",
    "marisa_trie",
    "fasttext",
    "fastapi",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra != 'train'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
train = [
    "accelerate>=1.15.0",
    "deepspeed>=0.19.8",
    "gensim>=4.4.0",
    "sentencepiece>=0.2.2",
    "sudachidict-full>=20261015",
    "sudachipy>=0.7.0",
]

[project.scripts]
pyuino = "pyuino.server:run"
pyuino-toybox = "pyuino.toybox:toy_run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel.force-include]
"toys/index.html" = "pyuino/index.html"
